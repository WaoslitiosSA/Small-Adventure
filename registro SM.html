<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Registro Small Adventure</title>
        <link rel="stylesheet" href="registro SM.css">
    </head>
    <body>
        <div class="contenedor">
<h1>Crear cuenta</h1>

<form id="registroForm">

<label>Correo electrónico</label>

<input
type="email"
id="registroCorreo"
required>

<label>Nombre de usuario</label>

<input
type="text"
id="nombre"
required>

<label>Crear contraseña</label>

<input type="password" id="registroPassword">

<label>Confirmar contraseña</label>

<input type="password" id="confirmar">

<button type="submit">

Registrarse

</button>

</form>

<p>

¿Ya tienes cuenta?

<a href="index.html" onclick="mostrarLogin()">
    Iniciar sesión
</a>

</p>

</div>

<script src="registro SM.js"></script>

</body>
</html>
