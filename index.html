<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>login Small Adventure</title>

    <link rel="stylesheet" href="login SM.css">

</head>

<body>

    <div class="contenedor">

        <h1>Small Adventure</h1>

        <h2>Iniciar Sesión</h2>


        <!-- =========================================
             FORMULARIO DE LOGIN
             ========================================= -->

        <form id="loginForm">

            <label>Correo electrónico</label>

            <input
                type="email"
                id="loginCorreo"
                placeholder="Ingrese su correo"
                required>


            <label>Contraseña</label>

            <input
                type="password"
                id="loginPassword"
                placeholder="Ingrese su contraseña"
                required>


            <button type="submit">
                Iniciar Sesión
            </button>

        </form>


        <!-- =========================================
             RECUPERAR CONTRASEÑA
             ========================================= -->

        <p class="enlace">

            <a href="#" id="enlaceRecuperar">
                ¿Olvidaste tu contraseña?
            </a>

        </p>


        <div
            id="recuperacionPassword"
            class="recuperacion-password">

            <h3>Recuperar contraseña</h3>

            <p>
                Ingresa tu correo y establece una nueva contraseña.
            </p>


            <label for="recuperarCorreo">
                Correo electrónico
            </label>

            <input
                type="email"
                id="recuperarCorreo"
                placeholder="Ingrese su correo">


            <label for="nuevaPassword">
                Nueva contraseña
            </label>

            <input
                type="password"
                id="nuevaPassword"
                placeholder="Ingrese una nueva contraseña">


            <label for="confirmarPassword">
                Confirmar contraseña
            </label>

            <input
                type="password"
                id="confirmarPassword"
                placeholder="Confirme la nueva contraseña">


            <div class="botones-recuperacion">

                <button
                    type="button"
                    id="cancelarRecuperacion">

                    Cancelar

                </button>


                <button
                    type="button"
                    id="guardarNuevaPassword">

                    Cambiar contraseña

                </button>

            </div>

        </div>


        <!-- =========================================
             REGISTRO
             ========================================= -->

        <p class="enlace">

            ¿No tienes una cuenta?

            <a
                href="registro SM.html"
                onclick="mostrarRegistro()">

                Registrarse

            </a>

        </p>

        <div id="toast"></div>

    </div>

    <script src="login SM.js"></script>

</body>

</html>
